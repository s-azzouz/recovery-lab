<svg xmlns="http://www.w3.org/2000/svg" width="1910" height="1024" viewBox="0 0 1910 1024" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
