<svg width="100%" viewBox="30 30 620 140" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>RecoveryLab wordmark in white and orange on a dark background</title>
<desc>The word recovery in white and Lab in orange, shown on a dark navy panel so the white text is visible, since white text needs a dark surface behind it to read.</desc>
<rect x="40" y="40" width="600" height="120" rx="12" fill="#163A5F"/>
<text x="340" y="115" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="34" fill="#FFFFFF">recovery<tspan fill="#F97316">Lab</tspan></text>
</svg>
